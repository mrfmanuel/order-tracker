apiVersion: 1

contactPoints:
  - orgId: 1
    name: incident-responder
    receivers:
      - uid: incident-responder-webhook
        type: webhook
        settings:
          url: http://host.docker.internal:8001/alerts
          httpMethod: POST

policies:
  - orgId: 1
    receiver: grafana-default-email
    group_by: ["grafana_folder", "alertname"]
    routes:
      # Route the 5xx alert to the incident-response webhook. Short
      # group_wait/group_interval so it's quick to see land during testing;
      # a long repeat_interval so a still-firing alert doesn't keep
      # re-triggering the agent every few minutes.
      - receiver: incident-responder
        object_matchers:
          - ["alertname", "=", "Order API 5xx errors"]
        group_wait: 5s
        group_interval: 5s
        repeat_interval: 12h
        continue: false
